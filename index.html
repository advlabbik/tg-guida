function dataKicker(iso){
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}
const LANG = (localStorage.getItem('tg-lang') === 'en') ? 'en' : 'it';
const C = CONTENT[LANG];
const U = C.ui;
document.documentElement.lang = LANG;
// riempie i segnaposto | di una stringa del dizionario
function fmt(tpl){ const p = tpl.split('|'); let o = p[0];
  for (let i = 1; i < arguments.length; i++) o += arguments[i] + (p[i] || ''); return o; }
const $ = s => document.querySelector(s);

/* ---------- notifiche push (sistema di Francesco, PR #13) ----------
   INTERRUTTORE: con false la card sparisce e non parte nessuna richiesta.
   Per lo spegnimento immediato basta cambiare questa riga e ripubblicare. */
const NOTIFICHE_ATTIVE = false; // spente su decisione di Andrea (13/08), si riaccendono da qui
const SUPABASE_URL = window.TG_SUPABASE_URL;
const SUPABASE_ANON_KEY = 'sb_publishable_kL1z4KhZWlxIpqE55KIQvw_rr3kZbih';
const VAPID_PUBLIC_KEY = 'BM20wU_676VT3P7CjS6j_9kFYXLnFzlODCAMTa6DZi8FftYWn4_hVDBtwAcW1GhiwFDXEi8A1NyR_Kgga90ZyFM';
const PUSH_ENDPOINT_KEY = 'tg-push-saved-endpoint';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
async function saveSubscription(sub){
  const subJson = sub.toJSON();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/tg_push_subscriptions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth })
  });
  if (!res.ok && res.status !== 409) throw new Error('salvataggio subscription fallito');
  localStorage.setItem(PUSH_ENDPOINT_KEY, subJson.endpoint);
}
// Il permesso resta 'granted' anche se il salvataggio era fallito o il browser
// ha ruotato l'endpoint: verifica silenziosa e ri-salvataggio quando serve.
async function verifyPushSubscription(){
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const savedEndpoint = localStorage.getItem(PUSH_ENDPOINT_KEY);
    if (sub.endpoint !== savedEndpoint) await saveSubscription(sub);
  } catch (err){ /* silenzioso, si riprova al prossimo giro */ }
}
async function refreshNotifCard(){
  const card = $('#notifcard');
  if (!card) return;
  if (!NOTIFICHE_ATTIVE || !pushSupported() || phase() === 'dopo'){
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  const btn = $('#notifbtn');
  const status = $('#notifstatus');
  if (Notification.permission === 'granted'){
    btn.style.display = 'none';
    status.textContent = U.notifiche.attive;
    verifyPushSubscription();
  } else if (Notification.permission === 'denied'){
    btn.style.display = 'none';
    status.textContent = U.notifiche.bloccate;
  } else {
    btn.style.display = '';
    status.textContent = '';
  }
}
async function activatePush(){
  const status = $('#notifstatus');
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted'){ refreshNotifCard(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    await saveSubscription(sub);
    refreshNotifCard();
  } catch (err){
    status.textContent = U.notifiche.errore;
  }
}
async function loadComunicazioni(){
  const sec = $('#commssec');
  const list = $('#commslist');
  if (!sec || !list) return;
  if (!NOTIFICHE_ATTIVE || phase() !== 'durante'){
    sec.style.display = 'none';
    return;
  }
  sec.style.display = '';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tg_broadcast_messages?select=title,body,created_at&order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) throw new Error('fetch fallita');
    const msgs = await res.json();
    list.innerHTML = msgs.length
      ? msgs.map(m => `<div class="avvisi"><h3>${esc(m.title)} · ${new Date(m.created_at).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'it-IT',{hour:'2-digit',minute:'2-digit'})}</h3><p>${esc(m.body)}</p></div>`).join('')
      : `<p class="muted">${esc(U.notifiche.nessuna)}</p>`;
  } catch (err){
    list.innerHTML = `<p class="muted">${esc(U.notifiche.erroreCarico)}</p>`;
  }
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- accesso riservato ai partecipanti ---------- */
/* Deterrente, non sicurezza vera: il codice arriva via email agli iscritti.
   Nell'area personale su bikeadventureseries.com il login sostituirà tutto questo. */
const GATE_CODE = 'PIONEER26'; // ✱ segnaposto
function initGate(){
  if (localStorage.getItem('tg-access') === GATE_CODE) return;
  $('#gate').style.display = 'flex';
  const tryCode = () => {
    const v = $('#gatecode').value.trim().toUpperCase();
    if (v === GATE_CODE){
      localStorage.setItem('tg-access', GATE_CODE);
      $('#gate').style.display = 'none';
    } else {
      $('#gateerr').textContent = U.gate.errore;
    }
  };
  $('#gatebtn').addEventListener('click', tryCode);
  $('#gatecode').addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });
}

/* ---------- fase (prima / durante / dopo) ---------- */
function autoPhase(){
  const today = new Date().toISOString().slice(0,10);
  if (today >= C.meta.fasi.dopo) return 'dopo';
  if (today >= C.meta.fasi.durante) return 'durante';
  return 'prima';
}
function phase(){
  const o = localStorage.getItem('tg-demo-phase');
  return (o && o !== 'auto') ? o : autoPhase();
}
document.querySelectorAll('#demobar button').forEach(b=>{
  b.addEventListener('click',()=>{
    localStorage.setItem('tg-demo-phase', b.dataset.ph);
    paintDemo(); renderHome();
  });
});
function paintDemo(){
  const cur = localStorage.getItem('tg-demo-phase') || 'auto';
  document.querySelectorAll('#demobar button').forEach(b=>b.classList.toggle('on', b.dataset.ph===cur));
}
// La barra demo (cambio fase) e' riservata al team: si attiva aprendo la guida
// con ?demo=1 e resta attiva su quel dispositivo. I partecipanti non la vedono.
if (new URLSearchParams(location.search).has('demo')) localStorage.setItem('tg-demo-visible', '1');
if (localStorage.getItem('tg-demo-visible')) $('#demobar').classList.add('visibile');
else localStorage.removeItem('tg-demo-phase');

/* ---------- installa in home ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  maybeShowInstall();
});
function isStandalone(){
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function maybeShowInstall(){
  const card = document.getElementById('installcard');
  if (!card) return;
  const ok = !isStandalone() && !localStorage.getItem('tg-install-off') && (deferredPrompt || isIOS());
  card.style.display = ok ? '' : 'none';
}
function bindInstall(){
  const btn = document.getElementById('installbtn'), later = document.getElementById('installlater');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; maybeShowInstall(); });
    } else {
      document.getElementById('iosmodal').style.display = 'flex';
    }
  });
  later.addEventListener('click', () => {
    localStorage.setItem('tg-install-off', '1');
    maybeShowInstall();
  });
}
document.getElementById('iosclose').addEventListener('click', () => {
  document.getElementById('iosmodal').style.display = 'none';
  localStorage.setItem('tg-install-off', '1');
});

/* ---------- header ---------- */
$('#h-title').textContent = C.meta.titolo;
$('#h-sub').textContent = C.meta.sottotitolo;

/* ---------- tabs ---------- */
let mapsInit = {};
function openTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  $('#tab-'+name).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  window.scrollTo({top:0});
  if (name==='percorso' && !mapsInit.mini) { mapsInit.mini = true; setTimeout(initMiniMap, 60); }
  if (name==='dormire' && !mapsInit.stay) { mapsInit.stay = true; loadStay22(); }
  if (name==='live' && !mapsInit.meteo) { mapsInit.meteo = true; loadMeteoTable(); loadSunset(); }
  // refreshNotifCard() trigger verifyPushSubscription() (service worker ready +
  // getSubscription + eventuale POST): va bene farlo una volta per sessione come
  // gli altri init qui sopra, non ad ogni rientro nella tab. loadComunicazioni()
  // resta libera di rifare fetch ad ogni apertura: è leggera e mostra messaggi nuovi.
  if (name==='live' && !mapsInit.notif) { mapsInit.notif = true; refreshNotifCard(); }
  if (name==='live') { loadComunicazioni(); }
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
window.addEventListener('resize', ()=>{
  if (miniMap) miniMap.invalidateSize();
  if (gpsMap) gpsMap.invalidateSize();
  if (rvMap && $('#routeview').classList.contains('open')){
    rvMap.invalidateSize();
    $('#rv-tip').style.display = 'none';
    rvSel = -1;
    rvLayout();
  }
});

/* ---------- HOME ---------- */
function renderHome(){
  const ph = phase();
  let h = '';
  h += `<div class="card" id="installcard" style="display:none">
    <h3><span class="e">${icon('smartphone', 20)}</span> ${esc(U.installa.titolo)}</h3>
    <p>${esc(U.installa.testo)}</p>
    <div class="btnrow"><button class="btn small" id="installbtn">${esc(U.installa.salva)}</button>
    <button class="btn small sec" id="installlater">${esc(U.installa.dopo)}</button></div></div>`;
  if (C.avvisi && C.avvisi.length){
    h += `<div class="avvisi"><h3>${esc(U.avvisiTitolo)}</h3>` +
      C.avvisi.map(a=>`<p>${esc(a.testo)}</p>`).join('') + `</div>`;
  }
  if (ph === 'prima') {
    h += `<div class="card hero"><div class="kicker">Pioneer Edition · ${dataKicker(C.meta.dataPartenza)}</div>
      <h2>${esc(C.intro.titolo)}</h2>
      <div id="countdown"></div>
      <p>${esc(C.intro.testo)}</p></div>`;
    h += `<div class="card"><h2>${esc(U.checklistTitolo)}</h2>
      <p class="muted">${esc(U.checklistSotto)}</p><div id="cklist">` +
      C.checklist.map(c=>{
        const m = c.testo.match(/^(\d+)\.\s*(.*)$/);
        const label = m ? m[2] : c.testo;
        return `<div class="chk" data-id="${c.id}">
        <div class="top">
          <label class="chk-box" for="ck-${c.id}"><input type="checkbox" id="ck-${c.id}" aria-label="${esc(label)}"/><span class="mark"></span></label>
          <span class="chk-label">${esc(label)}</span>
        </div>
        <div class="det">${esc(c.dettaglio||'')} ${c.url
          ? `<a href="${c.url}" target="_blank" rel="noopener">${esc(c.cta||'Apri')} ›</a>`
          : `<a href="#" data-tab="${c.tab}">${esc(U.vai)} ›</a>`}</div>
      </div>`;
      }).join('') + `</div></div>`;
    h += cardPercorsiBrevi();
  }
  if (ph === 'durante') {
    h += `<div class="bigbtns">
      <div class="bigbtn primary" data-tab="live" data-gps="1"><span class="e">${icon('crosshair', 26)}</span><b>Live</b><br/><span style="font-size:13.5px;opacity:.9">${esc(U.durante.liveSotto)}</span></div>
      <a class="bigbtn alert" href="tel:112"><span class="e">${icon('siren', 22)}</span><b>${esc(U.durante.emergenze)}</b></a>
      <div class="bigbtn" data-tab="live" data-share="1"><span class="e">${icon('share-2', 22)}</span><b>${esc(U.durante.condividi)}</b></div>
      <div class="bigbtn" data-tab="live" data-meteo="1"><span class="e">${icon('cloud-sun-rain', 22)}</span><b>${esc(U.durante.meteo)}</b></div>
      <div class="bigbtn" data-tab="dormire"><span class="e">${icon('bed-double', 22)}</span><b>${esc(U.durante.dormire)}</b></div>
      <div class="bigbtn" data-tab="info"><span class="e">${icon('info', 22)}</span><b>${esc(U.durante.info)}</b></div>
    </div>`;
  }
  if (ph === 'dopo') {
    h += `<div class="card hero"><h2>${esc(C.dopo.titolo)}</h2><p>${esc(C.dopo.testo)}</p></div>`;
    h += C.dopo.azioni.map(a=>`<div class="card"><h3>${a.icona} ${esc(a.titolo)}</h3>
      <p>${esc(a.testo)}</p>
      <div class="btnrow"><a class="btn" href="${a.url}" target="_blank" rel="noopener">${esc(a.cta)}</a></div></div>`).join('');
    if (C.dopo.prossimo) h += `<div class="card" style="border:2px solid var(--gold)"><h2>${esc(C.dopo.prossimo.titolo)}</h2>
      <p>${esc(C.dopo.prossimo.testo)}</p>
      <div class="btnrow"><a class="btn" href="${C.dopo.prossimo.url}" target="_blank" rel="noopener">${esc(C.dopo.prossimo.cta)}</a></div></div>`;
  }
  $('#tab-home').innerHTML = h;
  if (ph === 'prima') { startCountdown(); bindChecklist(); }
  bindTabLinks($('#tab-home'));
  bindInstall();
  maybeShowInstall();
}
function cardPercorsiBrevi(){
  return `<div class="card"><h2>${esc(U.trePercorsi)}</h2>
    <div class="rslider">` +
    C.percorsi.map((p,i)=>`<div class="rslide" data-tab="percorso" style="--col:${p.colore}">
      <div class="rslide-img">
        ${ROUTE_PHOTOS[p.id] ? `<img src="${ROUTE_PHOTOS[p.id]}" alt="${esc(p.nome)}" loading="lazy"/>` : ''}
        <span class="rslide-num">${i+1}</span>
        <div class="rslide-band"><b>${esc(p.nome)}</b><span>${p.km} km · ${p.dplus} m D+</span></div>
      </div>
    </div>`).join('') +
    `</div>
    <div class="btnrow"><button class="btn sec" data-tab="percorso">${esc(U.vaiPercorsi)}</button></div></div>`;
}
function bindTabLinks(root){
  root.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();
      openTab(el.dataset.tab);
      if (el.dataset.gps) setTimeout(startGPS, 250);
      if (el.dataset.share) { autoShare = true; setTimeout(startGPS, 250); }
      if (el.dataset.meteo) setTimeout(()=>{
        const s = document.getElementById('meteosec');
        if (s) s.scrollIntoView({behavior:'smooth'});
      }, 250);
    });
  });
}
function startCountdown(){
  const t = new Date(C.meta.dataPartenza).getTime();
  function tick(){
    const d = Math.max(0, t - Date.now());
    const gg = Math.floor(d/864e5), hh = Math.floor(d%864e5/36e5), mm = Math.floor(d%36e5/6e4);
    const el = $('#countdown');
    if (el) el.innerHTML = `<div><b>${gg}</b><span>${esc(U.countdown.giorni)}</span></div>
      <div><b>${hh}</b><span>${esc(U.countdown.ore)}</span></div><div><b>${mm}</b><span>${esc(U.countdown.minuti)}</span></div>`;
  }
  tick(); setInterval(tick, 30000);
}
function bindChecklist(){
  const st = JSON.parse(localStorage.getItem('tg-ck') || '{}');
  document.querySelectorAll('#cklist .chk').forEach(row=>{
    const id = row.dataset.id, cb = row.querySelector('input');
    cb.checked = !!st[id];
    row.classList.toggle('done', cb.checked);
    cb.addEventListener('change',()=>{
      st[id] = cb.checked;
      localStorage.setItem('tg-ck', JSON.stringify(st));
      row.classList.toggle('done', cb.checked);
    });
    row.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      if (e.target.closest('.chk-box')) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
  });
}

/* ---------- PERCORSO ---------- */
const ROUTE_PHOTOS = { corto: 'assets/percorsi/corto.jpg', medio: 'assets/percorsi/medio.jpg', lungo: 'assets/percorsi/lungo.jpg' };
function renderPercorso(){
  let h = `<div class="card"><h2>${esc(U.percorsoScegli)}</h2>
    <p>${fmt(esc(U.percorsoIntro), '<b>' + esc(C.meta.hub) + '</b>')}</p></div>`;
  h += C.percorsi.map(p=>`<div class="card route" style="--col:${p.colore}">
    <div class="rphoto" style="background:linear-gradient(160deg, ${p.colore}26, ${p.colore}59)">

function gapWarnings(list){
  // buchi > 20 km senza acqua ne' cibo: l'avviso che conta davvero
  const supply = list.filter(e => e.t === 'a' || e.t === 'm' || (e.t === 'c' && (e.ne > 0 || e.nf > 0)));
  const out = [];
  for (let i = 1; i < supply.length; i++){
    const gap = supply[i].km - supply[i-1].km;
    if (gap > 20) out.push({km: supply[i-1].km + 0.01, gap: Math.round(gap), a: Math.round(supply[i-1].km), b: Math.round(supply[i].km)});
  }

}

function arrowLayer(ll, color, stepKm){
  const g = L.layerGroup();
  const R=6371, rad=Math.PI/180;
  let cum=0, next=stepKm;
  for (let i=1;i<ll.length;i++){
    const a=ll[i-1], b=ll[i];
    const la1=a[0]*rad, la2=b[0]*rad, dla=la2-la1, dlo=(b[1]-a[1])*rad;
    const h=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
    cum += 2*R*Math.asin(Math.sqrt(h));
    if (cum >= next){
      next += stepKm;
      const brg = Math.atan2(Math.sin(dlo)*Math.cos(la2), Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dlo))/rad;
      g.addLayer(L.marker(b,{interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
        html:`<svg width="16" height="16" viewBox="-8 -8 16 16" style="transform:rotate(${brg-90}deg)"><path d="M-4,-5 L5,0 L-4,5 L-1.5,0 Z" fill="${color}" stroke="#fff" stroke-width="1.5"/></svg>`})}));
    }
  }
  return g;
}

/* ---------- VISTA PERCORSO: mappa + altimetria dentro l'app ----------
   Prima il bottone "Mappa + altimetria" apriva una pagina esterna che non aveva
   nessun link di ritorno. Chi ha la guida salvata in home ci finiva in una
   finestra senza barra del browser, quindi senza nemmeno il tasto indietro.
   Ora la schermata vive qui, con l'uscita in alto a sinistra, il tasto indietro
   di Android e il tasto Esc. */
const rvGeom = {};
function routeGeom(id){
  if (rvGeom[id]) return rvGeom[id];
  const T = TRACKS[id], c = T.coords, ele = T.ele;
  const R = 6371, rad = Math.PI/180;
  const cum = [0];
  for (let i = 1; i < c.length; i++){
    const la1 = c[i-1][1]*rad, la2 = c[i][1]*rad, dla = la2-la1, dlo = (c[i][0]-c[i-1][0])*rad;
    const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
    cum.push(cum[i-1] + 2*R*Math.asin(Math.sqrt(h)));
  }
  const tot = cum[cum.length-1];
  const p = C.percorsi.find(x => x.id === id) || {};
  const kmTot = p.km || Math.round(tot);
  /* La traccia di tracks.js e' semplificata e misura il 2-3% in meno del GPX
     completo, mentre i km dei POI arrivano dal GPX completo. Scalando tutto in
     modo lineare una fontana finirebbe fino a 2,7 km piu' avanti di dov'e'
     davvero, cioe' dalla parte sbagliata di una salita. I POI che hanno le
     coordinate fanno da ancora: per ognuno si cerca il punto traccia piu'
     vicino e si ottiene la coppia (km del POI, km sulla traccia). Fra un'ancora
     e l'altra si interpola. */
  const anchors = [[0, 0]];
  const poi = (window.POI && POI[id]) || [];
  poi.filter(e => e.lat != null).sort((a,b) => a.km - b.km).forEach(e => {
    const cl = Math.cos(e.lat*rad);
    let best = -1, bd = Infinity;
    for (let i = 0; i < c.length; i++){
      const dy = c[i][1]-e.lat, dx = (c[i][0]-e.lng)*cl;
      const d = dx*dx + dy*dy;
      if (d < bd){ bd = d; best = i; }
    }
    if (Math.sqrt(bd)*111 > 1) return; // troppo lontano dalla traccia per fidarsi
    const prev = anchors[anchors.length-1];
    if (e.km > prev[0]+0.05 && cum[best] > prev[1]+0.05) anchors.push([e.km, cum[best]]);
  });
  const last = anchors[anchors.length-1];
  if (kmTot > last[0]+0.05 && tot > last[1]+0.05) anchors.push([kmTot, tot]);
  const kmOf = d => {
    let lo = 0, hi = anchors.length-1;
    while (lo < hi-1){ const m = (lo+hi)>>1; if (anchors[m][1] <= d) lo = m; else hi = m; }
    const a = anchors[lo], b = anchors[hi];
    return a[0] + (b[0]-a[0]) * (d-a[1]) / ((b[1]-a[1]) || 1);
  };
  const kmAt = cum.map(kmOf);
  /* Dislivello che resta da qui all'arrivo. La somma grezza dei dislivelli di una
     traccia gonfia sempre il totale, quindi la si riporta in scala sul D+ ufficiale
     del percorso: il numero mostrato resta coerente con quello comunicato. */
  const upFrom = new Array(ele.length).fill(0);
  for (let i = ele.length-2; i >= 0; i--){
    const d = ele[i+1] - ele[i];
    upFrom[i] = upFrom[i+1] + (d > 0 ? d : 0);
  }
  // p.dplus e' testo gia' formattato e cambia con la lingua ("7.900" it, "7,900" en)
  const dpTot = parseInt(String(p.dplus || '').replace(/\D/g, ''), 10) || 0;
  const k = dpTot && upFrom[0] ? dpTot / upFrom[0] : 1;
  const g = { cum, tot, kmTot, kmAt, ele, ll: c.map(x => [x[1], x[0]]), colore: p.colore || '#2f9e44',
              nome: p.nome || id, dplusFrom: upFrom.map(v => Math.round(v*k/10)*10) };
  g.idxFromKm = km => {
    let lo = 0, hi = kmAt.length-1;
    while (lo < hi){ const m = (lo+hi)>>1; if (kmAt[m] < km) lo = m+1; else hi = m; }
    return lo;
  };
  /* Dove finisce un POI sulla mappa. Paesi e alloggi hanno le coordinate vere e
     si usano quelle. Fontane e posti dove mangiare hanno solo il km, perche' lo
     script di generazione butta lat/lon dopo aver calcolato la posizione lungo
     il percorso: quelli si appoggiano al punto della traccia a quel km. Restano
     comunque dentro il corridoio con cui sono stati cercati (500 m per il cibo,
     300 m per l'acqua), quindi il segno dice "a questo km del percorso", non
     "esattamente qui" — ed e' scritto nel testo sopra la lista. Per avere le
     posizioni vere servirebbe rigenerare poi.js da OpenStreetMap. */
  g.posOf = e => (e.lat != null) ? [e.lat, e.lng] : g.ll[g.idxFromKm(e.km)];
  rvGeom[id] = g;
  return g;
}
let rvId = null, rvMap = null, rvLayer = null, rvCur = null, rvFilter = 'tutti',
    rvSel = -1, rvPins = [], rvPushed = false;
const RV_ICO = { a:'droplets', m:'utensils', d:'bed-double', c:'landmark' };
function rvX(km, W){ return 44 + (W-44-12) * km / routeGeom(rvId).kmTot; }
function rvKmFromX(x, W){
  const g = routeGeom(rvId);
  return Math.max(0, Math.min(g.kmTot, (x-44)/(W-44-12) * g.kmTot));
}

function rvBuildMap(){
  const g = routeGeom(rvId);
  if (!rvMap){
    rvMap = L.map('rv-map');
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:18, attribution:'© Esri'}).addTo(rvMap);
    rvCur = L.circleMarker([0,0], {radius:7, color:'#fff', weight:2.5, fillColor:'#1971c2', fillOpacity:1, interactive:false});
    const pick = e => {
      const q = e.latlng, cl = Math.cos(q.lat*Math.PI/180);
      const gg = routeGeom(rvId);
      let best = -1, bd = Infinity;
      for (let i = 0; i < gg.ll.length; i++){
        const dy = gg.ll[i][0]-q.lat, dx = (gg.ll[i][1]-q.lng)*cl;
        const d = dx*dx + dy*dy;
        if (d < bd){ bd = d; best = i; }
      }
      if (Math.sqrt(bd)*111 < 2) rvShowAt(best); else rvHide();
    };
    rvMap.on('click', pick);
    rvMap.on('mousemove', pick);
    // i segni si ricalcolano a fine movimento: quali entrano dipende dallo zoom
    rvMap.on('moveend', rvMapPoi);

    rvMap.on('popupopen', ev => bindBook(ev.popup.getElement()));
  }
  if (rvLayer) rvMap.removeLayer(rvLayer);
  const ll = g.ll;
  rvLayer = L.layerGroup([
    L.polyline(ll, {color:'#fff', weight:8, opacity:.9}),
    L.polyline(ll, {color:g.colore, weight:4.5}),
    arrowLayer(ll, g.colore, 10),
    L.circleMarker(ll[0], {radius:8, color:'#fff', weight:2, fillColor:g.colore, fillOpacity:1}).bindPopup(U.rv.partenza),
    L.circleMarker(ll[ll.length-1], {radius:8, color:'#fff', weight:2, fillColor:'#c1121f', fillOpacity:1}).bindPopup(U.rv.arrivo)
  ]).addTo(rvMap);
  for (let km = 50; km < g.kmTot; km += 50){
    rvLayer.addLayer(L.circleMarker(ll[g.idxFromKm(km)], {radius:5, color:'#fff', weight:1.5, fillColor:'#16211a', fillOpacity:1})
      .bindTooltip('km ' + km, {direction:'top'}));
  }
  rvMap.invalidateSize();
  rvMap.fitBounds(L.latLngBounds(ll), {padding:[24,24]});
}
let rvW = 0, rvH = 0, rvEmin = 0, rvEmax = 0;
function rvY(e){ return 12 + (rvH-12-22) * (1 - (e-rvEmin)/((rvEmax-rvEmin) || 1)); }
function rvDraw(){
  if (!rvId) return;
  const g = routeGeom(rvId);
  const wrap = $('#rv-profwrap'), cv = $('#rv-prof'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  rvW = wrap.clientWidth; rvH = wrap.clientHeight;
  cv.width = rvW*dpr; cv.height = rvH*dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = (Math.max(...g.ele) - Math.min(...g.ele)) * 0.08;
  rvEmin = Math.floor((Math.min(...g.ele)-pad)/100)*100;
  rvEmax = Math.ceil((Math.max(...g.ele)+pad)/100)*100;
  ctx.clearRect(0, 0, rvW, rvH);
  ctx.font = '10.5px Inter, sans-serif';
  const step = (rvEmax-rvEmin) > 1500 ? 500 : 250;
  for (let e = Math.ceil(rvEmin/step)*step; e <= rvEmax; e += step){
    const y = rvY(e);
    ctx.strokeStyle = '#e8ece6'; ctx.beginPath(); ctx.moveTo(44, y); ctx.lineTo(rvW-12, y); ctx.stroke();
    ctx.fillStyle = '#8a958a'; ctx.textAlign = 'right'; ctx.fillText(e + ' m', 40, y+3.5);
  }
  const kstep = g.kmTot > 300 ? 100 : 50;
  for (let km = kstep; km < g.kmTot; km += kstep){
    const x = rvX(km, rvW);
    ctx.strokeStyle = '#f0f3ef'; ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, rvH-22); ctx.stroke();
    ctx.fillStyle = '#8a958a'; ctx.textAlign = 'center'; ctx.fillText(km, x, rvH-7);
  }
  ctx.fillStyle = '#8a958a'; ctx.textAlign = 'right'; ctx.fillText('km', rvW-12, rvH-7);
  ctx.beginPath(); ctx.moveTo(rvX(0, rvW), rvY(g.ele[0]));
  for (let i = 1; i < g.ele.length; i++) ctx.lineTo(rvX(g.kmAt[i], rvW), rvY(g.ele[i]));
  ctx.lineTo(rvX(g.kmTot, rvW), rvH-22); ctx.lineTo(rvX(0, rvW), rvH-22); ctx.closePath();
  const grad = ctx.createLinearGradient(0, 12, 0, rvH-22);
  grad.addColorStop(0, g.colore+'55'); grad.addColorStop(1, g.colore+'0d');
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(rvX(0, rvW), rvY(g.ele[0]));
  for (let i = 1; i < g.ele.length; i++) ctx.lineTo(rvX(g.kmAt[i], rvW), rvY(g.ele[i]));
  ctx.strokeStyle = g.colore; ctx.lineWidth = 1.8; ctx.stroke(); ctx.lineWidth = 1;
  if (rvSel >= 0){
    const x = rvX(g.kmAt[rvSel], rvW), y = rvY(g.ele[rvSel]);
    ctx.strokeStyle = '#16211a'; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, rvH-22); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = '#1971c2'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
  }
}
/* Il profilo si ridisegna a ogni tocco. Icone, segni sulla mappa e lista solo
   quando cambia il filtro o l'ingombro: sono le tre viste sugli stessi dati e
   il filtro le comanda tutte insieme. */
function rvLayout(){ rvDraw(); rvDrawPins(); rvMapPoi(); rvRenderList(); }
function rvRenderList(){
  const el = $('#rv-list');
  if (!el || !rvId) return;
  el.innerHTML = poiListHtml(rvId, rvFilter);
  bindBook(el);
}
/* I segni sulla mappa. Come sul profilo si mettono prima i piu' importanti, ma
   qui la distanza si misura in pixel sullo schermo.
   Chi finisce addosso a un altro NON sparisce: entra nel suo gruppo, e il segno
   porta il numero di quanti ne rappresenta. Serve perche' fontane e posti dove
   mangiare non hanno le coordinate vere e vengono appoggiati al punto della
   traccia al loro km: a Rovereto otto locali fra il km 2,3 e il km 3,0 cadono
   sullo stesso identico punto e nessuno zoom li separerebbe mai. Senza il
   numero la mappa direbbe "qui c'e' un posto" dove ce ne sono otto.
   Si disegna solo cio' che sta nella finestra visibile, altrimenti a mappa
   larga si costruirebbero 245 marcatori per vederne dieci. */
let rvMk = null;
function rvMapPoi(){
  if (!rvMap || !rvId || !$('#routeview').classList.contains('open')) return;
  const g = routeGeom(rvId);
  if (rvMk) rvMap.removeLayer(rvMk);
  rvMk = L.layerGroup().addTo(rvMap);
  const vista = rvMap.getBounds().pad(0.1);
  const pri = rvFilter === 'tutti' ? { c:0, a:1, m:2, d:3 } : { [rvFilter]:0, c:1 };
  const rank = e => (pri[e.t] != null ? pri[e.t] : 2);
  const gruppi = [];
  ((window.POI && POI[rvId]) || [])
    .filter(e => poiMatch(e, rvFilter))
    .sort((a,b) => (rank(a)-rank(b)) || (a.km-b.km))
    .forEach(e => {
      const ll = g.posOf(e);
      if (!ll || !vista.contains(ll)) return;
      const q = rvMap.latLngToContainerPoint(ll);
      const vicino = gruppi.find(gr => Math.abs(gr.q.x-q.x) < 28 && Math.abs(gr.q.y-q.y) < 28);
      if (vicino) vicino.membri.push(e);
      else gruppi.push({ q, ll, capo: e, membri: [e] });
    });
  gruppi.forEach(gr => {
    const e = gr.capo, n = gr.membri.length;
    rvMk.addLayer(L.marker(gr.ll, {icon: L.divIcon({className:'', iconSize:[24,24], iconAnchor:[12,12],
      html:`<span class="rvmk t-${e.t}">${icon(RV_ICO[e.t], 13)}${n > 1 ? `<i class="n">${n}</i>` : ''}</span>`})})
      .bindPopup(rvPopup(gr))
      .on('click', () => rvShowAt(g.idxFromKm(e.km), rvPinLabel(e))));
  });
}
function rvVoce(e){
  let det;
  if (e.t === 'c'){
    det = [e.ne?`${e.ne} ${U.conteggi.m}`:null, e.ns?`${e.ns} ${U.conteggi.d}`:null, e.nf?`${e.nf} ${U.conteggi.a}`:null]
      .filter(Boolean).join(' · ');
  } else {
    det = [(e.nome && e.t !== 'a') ? esc(subLingua(e.sub)) : null, e.luogo ? esc(e.luogo) : null]
      .filter(Boolean).join(' · ');
  }
  const prenota = (e.t === 'd' || (e.t === 'c' && e.ns)) ? bookBtn(e) : '';
  return `<b>${rvPinLabel(e).split('<br/>')[0]}</b><span class="km"> · km ${Math.round(e.km)}</span>` +
    (det ? `<span class="det">${det}</span>` : '') + prenota;
}
const RV_POP_MAX = 8; // oltre questa soglia il fumetto diventa un muro di testo
function rvPopup(gr){
  if (gr.membri.length === 1) return `<div class="rvpop">${rvVoce(gr.capo)}</div>`;
  const mostrati = gr.membri.slice(0, RV_POP_MAX);
  const restanti = gr.membri.length - mostrati.length;
  return `<div class="rvpop gruppo"><b class="tit">${fmt(esc(U.rv.quiCiSono), gr.membri.length)}</b>` +
    mostrati.map(e => `<div class="voce">${rvVoce(e)}</div>`).join('') +
    (restanti ? `<div class="voce muted">${fmt(esc(U.rv.eAltri), restanti)}</div>` : '') + `</div>`;
}
/* I punti stanno sul profilo alla loro quota. Su un telefono ci stanno una
   ventina di icone senza sovrapporsi, quindi si sceglie per importanza (paesi,
   poi acqua, poi cibo, poi alloggi) e si dice sempre quanti ne restano fuori. */
function rvDrawPins(){
  const g = routeGeom(rvId), box = $('#rv-pins');
  const list = ((window.POI && POI[rvId]) || []).filter(e => poiMatch(e, rvFilter));
  /* Con "tutto" vengono prima i paesi, che riassumono gia' i servizi di una zona.
     Con un filtro attivo vengono prima i punti di quella categoria, altrimenti i
     paesi si prenderebbero tutti i posti e le fontane in mezzo al nulla — quelle
     che contano davvero — non si vedrebbero mai. */
  const pri = rvFilter === 'tutti' ? { c:0, a:1, m:2, d:3 } : { [rvFilter]:0, c:1 };
  const rank = e => (pri[e.t] != null ? pri[e.t] : 2);
  const taken = [];
  rvPins = [];
  list.slice().sort((a,b) => (rank(a)-rank(b)) || (a.km-b.km)).forEach(e => {
    const x = rvX(e.km, rvW), y = rvY(g.ele[g.idxFromKm(e.km)]);
    // le icone stanno alla quota del loro km: due vicine in km ma lontane in
    // altezza non si toccano, quindi il controllo e' su tutte e due le direzioni
    if (taken.some(t => Math.abs(t[0]-x) < 25 && Math.abs(t[1]-y) < 22)) return;
    taken.push([x, y]);
    rvPins.push(e);
  });
  box.innerHTML = rvPins.map((e,i) => {
    const idx = g.idxFromKm(e.km);
    return `<button class="rvpin t-${e.t}" data-pin="${i}" style="left:${rvX(e.km, rvW)}px;top:${rvY(g.ele[idx])}px">${icon(RV_ICO[e.t], 13)}</button>`;
  }).join('');
  box.querySelectorAll('.rvpin').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    rvSelectPin(+b.dataset.pin);
  }));
  $('#rv-foot').innerHTML = (list.length
    ? `<span>${fmt(esc(U.rv.mostrati), '<b>'+rvPins.length+'</b>', '<b>'+list.length+'</b>')}</span>`
    : `<span>${esc(U.rv.nessunPunto)}</span>`)
    + `<span>${esc(U.rv.aiuto)}</span>`;
}
function rvPinLabel(e){
  if (e.t === 'c'){
    const det = [e.ne?`${e.ne} ${U.conteggi.m}`:null, e.ns?`${e.ns} ${U.conteggi.d}`:null, e.nf?`${e.nf} ${U.conteggi.a}`:null]
      .filter(Boolean).join(' · ');
    return esc(e.nome) + (det ? `<br/>${det}` : '');
  }
  if (e.t === 'a' && e.n > 1) return `${e.n} ${esc(U.fontane)}`;
  return esc(e.nome || subLingua(e.sub));
}
function rvSelectPin(i){
  const e = rvPins[i];
  if (!e) return;
  const g = routeGeom(rvId);
  rvShowAt(g.idxFromKm(e.km), rvPinLabel(e));
  $('#rv-pins').querySelectorAll('.rvpin').forEach(b => b.classList.toggle('sel', +b.dataset.pin === i));
}
function rvShowAt(i, label){
  const g = routeGeom(rvId);
  rvSel = i;
  rvDraw();
  const tip = $('#rv-tip');
  const km = g.kmAt[i];
  tip.style.display = 'block';
  tip.style.left = Math.min(Math.max(rvX(km, rvW), 54), rvW-54) + 'px';
  tip.style.top = Math.max(rvY(g.ele[i]), 58) + 'px';
  tip.innerHTML = (label ? `<b>${label}</b><br/>` : '') +
    `km ${km.toFixed(1).replace('.', ',')} · ${g.ele[i]} m ${esc(U.rv.quota)}<br/>` +
    fmt(esc(U.rv.daQui), Math.round(g.kmTot-km), g.dplusFrom[i]);
  rvCur.setLatLng(g.ll[i]);
  if (!rvMap.hasLayer(rvCur)) rvCur.addTo(rvMap);
}
function rvHide(){
  rvSel = -1; rvDraw();
  $('#rv-tip').style.display = 'none';
  if (rvMap && rvMap.hasLayer(rvCur)) rvMap.removeLayer(rvCur);
}
function rvScrub(clientX){

/* ---------- METEO (Open-Meteo, gratuito, senza chiave) ---------- */
function wIcon(code){
  if (code === 0) return '☀️';
  if (code <= 2) return '🌤️';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌧️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}
function fmtDay(iso){
  const d = new Date(iso + 'T12:00:00');
  return U.giorniSett[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
}
function meteoDays(){
  const todayIso = new Date().toISOString().slice(0,10);
  const horizon = new Date(Date.now() + 14*864e5).toISOString().slice(0,10);
  if (C.meteo.giorniEvento[0] <= horizon && C.meteo.giorniEvento[C.meteo.giorniEvento.length-1] >= todayIso){
    return { days: C.meteo.giorniEvento.filter(d => d >= todayIso), nota: '' };
  }
  const days = [];
  for (let i = 0; i < 6; i++) days.push(new Date(Date.now() + i*864e5).toISOString().slice(0,10));
  return { days, nota: U.meteoNota };
}
async function loadMeteoTable(){
  const { days, nota } = meteoDays();
  $('#meteonote').textContent = nota;
  const tab = $('#meteotab');
  tab.innerHTML = '<tr><th class="loc"></th>' + days.map(d=>`<th>${fmtDay(d)}</th>`).join('') + '</tr>' +
    C.meteo.localita.map((l,i)=>`<tr><td class="loc">${esc(l.nome)}</td>` +
      days.map(()=>'<td>…</td>').join('') + '</tr>').join('');
  await Promise.all(C.meteo.localita.map(async (l, li) => {
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lng}` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FRome` +
        `&start_date=${days[0]}&end_date=${days[days.length-1]}`;
      const r = await fetch(u).then(x=>x.json());
      const row = tab.rows[li+1];
      days.forEach((d, di) => {
        const j = r.daily.time.indexOf(d);
        row.cells[di+1].innerHTML = j < 0 ? '—' :
          `<span class="wi">${wIcon(r.daily.weather_code[j])}</span>` +
          `<span class="tt">${Math.round(r.daily.temperature_2m_min[j])}°/${Math.round(r.daily.temperature_2m_max[j])}°</span>`;
      });
    } catch(e){ /* offline: la tabella resta con i puntini */ }
  }));
}

async function meteoGPS(){
  const box = $('#meteogps');
  box.style.display = 'block';
  if (!navigator.geolocation){ box.textContent = U.gpsNo; return; }
  box.textContent = U.gpsCerco;
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}` +
        `&current=temperature_2m,weather_code,wind_speed_10m,precipitation` +
        `&hourly=precipitation_probability&daily=sunset&timezone=Europe%2FRome&forecast_days=1`;
      const r = await fetch(u).then(x=>x.json());
      const c = r.current;
      const hNow = new Date().getHours();
      const prob = r.hourly && r.hourly.precipitation_probability ? r.hourly.precipitation_probability[hNow] : null;
      const sunset = r.daily && r.daily.sunset ? r.daily.sunset[0].slice(11,16) : null;

        (prob !== null ? ` · ${esc(U.pioggia)} ${prob}%` : '') +
        (sunset ? `<br/>${esc(U.tramontaQui)} <b>${sunset}</b>.` : '');
    } catch(e){ box.textContent = U.meteoOffline; }

let gpsMap, gpsMarker, gpsLine, gpsLineRoute, gpsWatch, gpsArrows, gpsArrowsRoute, lastPos = null, autoShare = false;
function sharePos(){

  const text = `${U.condividiTesto} — ${url}`;
  if (navigator.share) navigator.share({text}).catch(()=>{});
  else window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');

function haversine(a, b){
  const R=6371, rad=Math.PI/180;
  const la1=a[0]*rad, la2=b[0]*rad, dla=la2-la1, dlo=(b[1]-a[1])*rad;
  const h=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function aheadHtml(rid, km){

     <span class="muted">(km ${Math.round(e.km)})</span></span>${book ? bookBtn(e) : ''}</div>`;
  let h = `<b>${esc(U.davanti)}</b>`;
  if (w) h += row(icon('droplets',16), 't-a', w, w.t === 'c' ? esc(w.nome) + ` (${w.nf} ${esc(U.fontane)})` : (w.n > 1 ? `${w.n} ${esc(U.fontane)}` : esc(U.fontana)), false);
  if (f) h += row(icon('utensils',16), 't-m', f, f.t === 'c' ? esc(f.nome) + ` (${f.ne} ${esc(U.posti)})` : esc(f.nome || subLingua(f.sub)), false);
  ss.forEach(e => h += row(icon('bed-double',16), 't-d', e, e.t === 'c' ? esc(e.nome) + ` (${e.ns} ${esc(U.alloggi)})` : esc(e.nome || subLingua(e.sub)), true));

    const rid = $('#gpsroute').value;
    const p = C.percorsi.find(x=>x.id===rid);
    const track = TRACKS[rid].coords.map(c=>[c[1],c[0]]);
    // punto più vicino + km percorso
    let best=0, bd=Infinity;
    for (let i=0;i<track.length;i++){
      const d = (track[i][0]-me[0])**2 + ((track[i][1]-me[1])*Math.cos(me[0]*Math.PI/180))**2;
      if (d<bd){bd=d; best=i;}
    }
    let km=0;
    for (let i=1;i<=best;i++) km += haversine(track[i-1], track[i]);
    const distTrack = haversine(me, track[best]);
    const kmTot = p.km;
    if (distTrack > 3){
      info.innerHTML = fmt(esc(U.gpsLontano), `<b>${distTrack.toFixed(1)}</b>`, esc(p.nome), `<b>${km.toFixed(0)}</b>`);
    } else {
      info.innerHTML = fmt(esc(U.gpsPosizione), `<b>${km.toFixed(0)}</b>`, kmTot, esc(p.nome), `<b>${Math.max(0,kmTot-km).toFixed(0)}</b>`);
    }
    info.innerHTML += `<div style="margin-top:7px"><button class="btn small sec" id="shareposbtn">${esc(U.condividiPos)}</button></div>`;
    const aheadBox = $('#gpsahead');
    const ah = aheadHtml(rid, km);
    if (ah){ aheadBox.style.display = 'block'; aheadBox.innerHTML = ah; bindBook(aheadBox); }
    else aheadBox.style.display = 'none';
    const mapEl = $('#gpsmap');
    mapEl.style.display = 'block';
    if (!gpsMap){
      gpsMap = L.map('gpsmap');
      L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© CyclOSM · © OpenStreetMap'}).addTo(gpsMap);
    }
    if (gpsLineRoute !== rid){
      if (gpsLine) gpsMap.removeLayer(gpsLine);
      gpsLine = L.polyline(track,{color:p.colore,weight:4}).addTo(gpsMap);
      gpsLineRoute = rid;
    }
    if (gpsArrowsRoute !== rid){
      if (gpsArrows) gpsMap.removeLayer(gpsArrows);
      gpsArrows = arrowLayer(track, p.colore, 10).addTo(gpsMap);
      gpsArrowsRoute = rid;
    }
    if (gpsMarker) gpsMap.removeLayer(gpsMarker);
    gpsMarker = L.circleMarker(me,{radius:9,color:'#fff',weight:2.5,fillColor:'#1971c2',fillOpacity:1}).addTo(gpsMap).bindPopup('Sei qui');
    gpsMap.setView(me, 13);
  }, err=>{
    info.textContent = U.gpsNegato;
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
}

const INDEX = [];
C.infoCards.forEach(c=>INDEX.push({tab:'info', el:'info-'+c.id, t:c.titolo, s:c.corpo.slice(0,90)+'…', k:(c.titolo+' '+c.corpo+' '+c.cerca).toLowerCase()}));
C.percorsi.forEach(p=>INDEX.push({tab:'percorso', t:p.nome, s:`${p.km} km · ${p.dplus} m D+ · ${p.livello}`, k:(p.nome+' '+p.desc+' '+p.note.join(' ')+' percorso traccia gpx km dislivello').toLowerCase()}));
INDEX.push({tab:'dormire', t:'Arrivare e dormire', s:'La mappa alloggi con prezzi e disponibilità', k:'dormire prenotare hotel alloggio notte mappa campeggio booking prenotazione'});
INDEX.push({tab:'live', t:'Dove sono / Meteo', s:'GPS sul percorso, meteo e tramonto', k:'live gps dove sono posizione meteo tramonto davanti'});
INDEX.push({tab:'home', t:'Checklist di preparazione', s:'Le cose da fare prima di partire', k:'checklist preparazione lista cose da fare prima'});

$('#searchbtn').addEventListener('click',()=>{ $('#searchov').classList.add('open'); $('#searchinput').focus(); });
$('#searchov').addEventListener('click',e=>{ if(e.target.id==='searchov') $('#searchov').classList.remove('open'); });
$('#searchinput').addEventListener('input',e=>{
  const q = e.target.value.trim().toLowerCase();
  const box = $('#searchres');
  if (!q){ box.innerHTML=''; return; }
  const hits = INDEX.filter(i=>q.split(/\s+/).every(w=>i.k.includes(w))).slice(0,8);
  box.innerHTML = hits.length
    ? hits.map((h,i)=>`<div class="sres" data-i="${INDEX.indexOf(h)}"><b>${esc(h.t)}</b><span>${esc(h.s)}</span></div>`).join('')
    : `<div class="snull">${esc(U.cercaNulla)}</div>`;
  box.querySelectorAll('.sres').forEach(r=>r.addEventListener('click',()=>{
    const h = INDEX[+r.dataset.i];
    $('#searchov').classList.remove('open');
    openTab(h.tab);
    if (h.el){ const el = document.getElementById(h.el);
      if (el){ setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),150); } }
  }));
});

  });
  // se arriva una versione nuova mentre l'app è aperta, si ricarica da sola
  const avevaSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});

  });
